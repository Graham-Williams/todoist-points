version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # ~20 direct deps between the app and the build tooling. Batch the safe
      # bumps into one PR; majors still get their own PR so each breaking
      # change (Next, React, better-sqlite3) is reviewed on its own.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node ships even majors as LTS and odd majors as Current: 24 is LTS, 25
      # is not. A major bump is therefore either a non-LTS line or the next LTS
      # migration — never something to take automatically. The image is pinned
      # by digest, so digest refreshes of node:24 (the security rebuilds) still
      # arrive as PRs.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # The CI workflow pins every action by commit SHA, which is only safe if the
  # pins are actually maintained — an unmaintained pin silently freezes on an
  # old, possibly vulnerable release. This is the stream that keeps them fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
